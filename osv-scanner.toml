# OSV-Scanner configuration — https://google.github.io/osv-scanner/configuration/
#
# Liste d'exceptions CIBLÉE : vulnérabilités triées comme NON APPLICABLES à ce
# déploiement, pour qu'un non-problème connu ne fasse pas échouer le contrôle OSV
# BLOQUANT. Toute vulnérabilité absente d'ici fait encore échouer la CI. Chaque
# entrée reflète une alerte code-scanning écartée — garder les deux en phase.
#
# ⚠ CE QUI FILTRE N'EST PAS CE QUI DÉCIDE, et il faut le savoir pour ne pas se
#   tromper de fichier en cas d'échec. `osv-scanner` sort en 1 dès qu'une
#   vulnérabilité est trouvée, MÊME filtrée par ce fichier — son journal dit
#   « Filtered 1 vulnerability » puis « Exit code: 1 ». Le verdict bloquant est donc
#   rendu par l'étape « Verdict » de `.github/workflows/osv-scanner.yml`, qui compte
#   les constats RESTANTS dans le rapport SARIF, c'est-à-dire après application de ce
#   fichier. Les deux se lisent ensemble : ici le TRI, là-bas la DÉCISION.
#
# ── sharp / libvips : GHSA-f88m-g3jw-g9cj ────────────────────────────────────
# `sharp` est une dépendance OPTIONNELLE et TRANSITIVE de miniflare/wrangler,
# employée uniquement pour émuler LOCALEMENT le binding Images de Cloudflare.
#
# Trois raisons d'irrecevabilité, cumulatives :
#   1. Ce Worker n'a AUCUN binding Images (voir wrangler.jsonc) : le code de
#      miniflare qui charge sharp n'est jamais atteint, même en dev.
#   2. `sharp` est en devDependencies transitives. Le bundle déployé sur workerd
#      ne contient ZÉRO dépendance npm (décision D2 : aucun cadriciel, aucune
#      dépendance d'exécution) — sharp ne franchit jamais la frontière du déploiement.
#   3. Les CVE visent le décodage d'images non fiables par libvips. Ce connecteur
#      ne traite aucune image : ses entrées sont des citations et des identifiants
#      de tribunaux, ses sorties du texte français.
#
# ⚠ NE PAS RÉAJOUTER LES ALIAS CVE (CVE-2026-33327, -33328, -35590, -35591).
#   Ils ont figuré ici jusqu'au 2026-09-16, « par prudence ». OSV n'emploie que
#   l'identifiant GHSA : ces quatre entrées ne s'appariaient donc JAMAIS, et l'outil
#   sort en ERREUR sur une exemption inutilisée. Résultat : l'analyseur de
#   vulnérabilités a échoué à CHAQUE exécution du 2026-08-30 au 2026-09-16 —
#   trente-cinq fois — non pour une faille, mais pour ces quatre lignes. Un contrôle
#   de sécurité rouge en permanence cesse d'être lu, ce qui est exactement ce que
#   l'écrire BLOQUANT cherchait à éviter.
#
#   Corollaire à connaître : si l'avis remontait un jour sous un identifiant CVE
#   plutôt que GHSA, le filtre ne jouerait pas et le contrôle virerait au rouge.
#   C'est le comportement VOULU — il faudrait alors réexaminer, pas re-filtrer.
#
# Aucun correctif non cassant n'existe en amont : `npm audit fix --force`
# rétrograderait @cloudflare/vitest-pool-workers de 0.18.x à 0.8.30. À réexaminer
# à chaque montée de wrangler/miniflare (Dependabot, hebdomadaire).

[[IgnoredVulns]]
id = "GHSA-f88m-g3jw-g9cj"
reason = "sharp/libvips via miniflare (émulation locale du binding Images). Aucun binding Images ici, dépendance de développement transitive jamais déployée (bundle sans dépendance npm), et aucune image n'est traitée. Pas de correctif non cassant en amont."
