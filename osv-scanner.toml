# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# ── Comment écrire une exemption, le jour où il en faudra vraiment ────────────
#
# Chaque entrée porte l'identifiant que l'OSV emploie RÉELLEMENT — en pratique le
# GHSA, jamais ses alias CVE. Quatre alias ont figuré ici jusqu'au 2026-09-16 « par
# prudence » : ils ne s'appariaient jamais, et `osv-scanner` sort en ERREUR sur une
# exemption inutilisée. Résultat, le contrôle a échoué trente-cinq fois pour cette
# seule raison. Un identifiant de trop n'est pas neutre.
#
# Chaque entrée porte aussi son MOTIF et sa DATE, en toutes lettres. Une exemption
# sans raison écrite est indiscernable d'un oubli, et personne n'ose la retirer.
#
# ⚠ CE QUI FILTRE N'EST PAS CE QUI DÉCIDE. `osv-scanner` sort en 1 dès qu'une
#   vulnérabilité est trouvée, MÊME filtrée par ce fichier. Le verdict bloquant est
#   rendu par l'étape « Verdict » de `.github/workflows/osv-scanner.yml`, qui compte
#   les constats RESTANTS dans le rapport SARIF — c'est-à-dire après application de
#   ce fichier. Les deux se lisent ensemble : ici le TRI, là-bas la DÉCISION.
#
# ⚠ ET LE RÉSUMÉ CONSOLE NE MONTRE PAS LES CONSTATS. En mode SARIF, le journal du
#   scanner n'affiche que le nombre de vulnérabilités FILTRÉES. Le 2026-09-16, ce
#   « Filtered 1 vulnerability » a été pris pour la totalité des constats, alors que
#   le rapport en contenait SEPT non exemptées. Lire le SARIF, jamais le résumé.
