name: "Signalement d'anomalie / Bug Report"
description: "Signaler un bogue technique reproductible (sans aucune donnée client ni secret) / Report a reproducible technical bug"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Confidentialité et secret professionnel / Privacy & Privilege Warning**
        > **Ne jamais inclure** de noms de clients, numéros de dossier réels, faits protégés par le secret professionnel (`secret professionnel` / solicitor-client or litigation privilege), chemins locaux personnels ou jetons `MCP_*` / `Bearer`.
        > Pour un enjeu de **sécurité, confidentialité ou secret professionnel**, utilisez plutôt le [signalement privé de vulnérabilité](../../security/advisories/new) ou écrivez à `jason@poirierlavoie.ca` (voir [`SECURITY.md`](../../blob/main/SECURITY.md)).
  - type: textarea
    id: description
    attributes:
      label: "Description et étapes de reproduction / Description & Reproduction Steps"
      description: "Décrivez le bogue avec un exemple synthétique minimal (aucune donnée client)."
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: "Comportement attendu vs observé / Expected vs Observed Behavior"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environnement / Client MCP"
      placeholder: "Claude Code / Claude Desktop / Antigravity / Gemini CLI / Node.js / commit SHA..."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: "Attestation de confidentialité / Confidentiality Confirmation"
      options:
        - label: "Je confirme que ce signalement ne contient aucune information confidentielle ou protégée par le secret professionnel, ni aucun jeton ou secret actif. / I confirm this issue contains zero confidential or privileged client facts and zero live tokens or secrets."
          required: true
