version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/Montreal"
    open-pull-requests-limit: 5
    assignees:
      - "jpoirierlavoie"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@poirierlavoie/mcp-socle"
      - dependency-name: "vitest"
        versions: [">= 5.0.0"]
      - dependency-name: "@biomejs/biome"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      dev-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "America/Montreal"
    open-pull-requests-limit: 5
    assignees:
      - "jpoirierlavoie"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
