name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Types du Worker
        run: npx wrangler types

      - name: Type-check
        run: npx tsc --noEmit

      - name: Mise en forme et lint
        run: npx biome check .

      - name: Tests
        run: npx vitest run

      - name: Audit des dépendances
        run: npm run audit

      - name: Paquet de déploiement (à blanc)
        run: npx wrangler deploy --dry-run
