name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '21 15 * * 4'
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ce workflow ne se déclenche jamais sur `pull_request` (voir `on:` ci-dessus) :
    # l'alternative « || github.event_name == 'pull_request' » qui figurait ici ne
    # pouvait donc jamais être vraie. Retirée le 2026-09-16 — une condition morte laisse
    # croire à une couverture qui n'existe pas.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Le GITHUB_TOKEN par défaut suffit à tous les contrôles sauf le détail de
          # Branch-Protection ; un PAT permanent dans les secrets du dépôt serait une
          # cible d'exfiltration inutile.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
