name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '21 15 * * 4'
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ce workflow ne se déclenche jamais sur `pull_request` (voir `on:` ci-dessus) :
    # l'alternative « || github.event_name == 'pull_request' » qui figurait ici ne
    # pouvait donc jamais être vraie. Retirée le 2026-09-16 — une condition morte laisse
    # croire à une couverture qui n'existe pas.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Le GITHUB_TOKEN par défaut suffit à tous les contrôles sauf le détail de
          # Branch-Protection ; un PAT permanent dans les secrets du dépôt serait une
          # cible d'exfiltration inutile.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
          category: scorecard
