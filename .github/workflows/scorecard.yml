name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '21 15 * * 4'
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ce workflow ne se déclenche jamais sur `pull_request` (voir `on:` ci-dessus) :
    # l'alternative « || github.event_name == 'pull_request' » qui figurait ici ne
    # pouvait donc jamais être vraie. Retirée le 2026-09-16 — une condition morte laisse
    # croire à une couverture qui n'existe pas.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Le GITHUB_TOKEN par défaut suffit à tous les contrôles sauf le détail de
          # Branch-Protection ; un PAT permanent dans les secrets du dépôt serait une
          # cible d'exfiltration inutile.
          publish_results: true

      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: results.sarif
          category: scorecard
