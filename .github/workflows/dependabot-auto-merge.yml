name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable squash auto-merge for eligible non-major updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEP_TYPE: ${{ steps.metadata.outputs.dependency-type }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "Skipping auto-merge for update-type=${UPDATE_TYPE}."
              exit 0
              ;;
          esac
          case "$ECOSYSTEM" in
            github_actions|github-actions) ;;
            npm_and_yarn|npm)
              case "$DEP_TYPE" in
                direct:development|indirect) ;;
                *)
                  echo "Skipping auto-merge for npm dependency-type=${DEP_TYPE}."
                  exit 0
                  ;;
              esac
              ;;
            *)
              echo "Skipping auto-merge for ecosystem=${ECOSYSTEM}."
              exit 0
              ;;
          esac
          gh pr merge --auto --squash "$PR_URL"
