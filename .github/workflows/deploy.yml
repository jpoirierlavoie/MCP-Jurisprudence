name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Contrôle 1/4 — le secret CLOUDFLARE_API_TOKEN parvient-il au job ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            case "$CLOUDFLARE_API_TOKEN" in
              *[[:space:]]*)
                echo "::error title=Le jeton contient une espace ou un saut de ligne::Un jeton copié avec son retour chariot est refusé par Cloudflare sans que rien ne l'explique (§14). Recoller la valeur SANS la dernière frappe d'entrée."
                exit 1
                ;;
            esac
            echo "Le secret est présent et ne porte aucune espace."
            exit 0
          fi
          echo "::error title=CLOUDFLARE_API_TOKEN est VIDE dans ce job::Définir le secret dans l'environnement GitHub « production » (gh secret set CLOUDFLARE_API_TOKEN --env production -R jpoirierlavoie/MCP-Jurisprudence)."
          exit 1

      - name: Contrôle 2/4 — Cloudflare accepte-t-il ce jeton ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq est absent de l'image du runner."; exit 1; }
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/verify.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
          statut=$(jq -r '.result.status // "inconnu"' /tmp/verify.json 2>/dev/null || echo inconnu)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/verify.json 2>/dev/null || echo "")
          case "$code" in
            200)
              echo "Jeton reconnu, statut « ${statut} »."
              if [ "$statut" != "active" ]; then
                echo "::error title=Jeton non actif (${statut})::Un jeton expiré ou suspendu se remplace."
                exit 1
              fi
              ;;
            401|403)
              echo "::error title=Jeton REFUSÉ par Cloudflare (HTTP ${code})::${motifs:-aucun motif rendu}. Vérifier la valeur stockée dans l'environnement « production »."
              exit 1
              ;;
            000)
              echo "::error title=api.cloudflare.com injoignable::Vérifier la politique réseau du runner."
              exit 1
              ;;
            *)
              echo "::notice title=Vérification non concluante (HTTP ${code})::${motifs:-sans motif}. Non bloquant pour un jeton de compte : les contrôles 3 et 4 trancheront."
              ;;
          esac

      - name: Contrôle 3/4 — le jeton désigne-t-il UN SEUL compte ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "CF_COMPTE=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "Compte fourni par la configuration."
            exit 0
          fi
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/comptes.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/accounts || echo 000)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/comptes.json 2>/dev/null || echo "")
          if [ "$code" != "200" ]; then
            echo "::error title=Le jeton ne peut pas énumérer les comptes (HTTP ${code})::${motifs:-sans motif}. Ajouter « Account Settings: Read » au jeton ou définir CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          n=$(jq '[.result[]?] | length' /tmp/comptes.json)
          echo "Comptes visibles par ce jeton : ${n}."
          if [ "$n" -ne 1 ]; then
            echo "::error title=Comptes visibles attendus = 1, obtenu = ${n}::Ajuster la portée « Account Resources » du jeton ou définir CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          compte=$(jq -r '.result[0].id' /tmp/comptes.json)
          echo "::add-mask::$compte"
          echo "CF_COMPTE=$compte" >> "$GITHUB_ENV"
          echo "Un seul compte : wrangler le choisira sans ambiguïté."

      - name: Contrôle 4/4 — la base D1 « canlii » correspond-elle à wrangler.jsonc ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CF_COMPTE:-}" ]; then
            echo "::error title=Identifiant de compte manquant::Le contrôle 3 n'a pas exporté CF_COMPTE."
            exit 1
          fi
          attendu=$(grep -oE '"database_id"[[:space:]]*:[[:space:]]*"[^"]+"' wrangler.jsonc | head -1 | grep -oE '[0-9a-fA-F-]{36}' || true)
          if [ -z "$attendu" ]; then
            echo "::error title=Identifiant de base D1 illisible dans wrangler.jsonc::Impossible de comparer sans identifiant attendu."
            exit 1
          fi
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/d1.json -w '%{http_code}' \
                   "https://api.cloudflare.com/client/v4/accounts/${CF_COMPTE}/d1/database?name=canlii" || echo 000)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/d1.json 2>/dev/null || echo "")
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error title=Le jeton n'a pas accès à D1 sur ce compte (HTTP ${code})::${motifs:-sans motif}. Vérifier « Account > D1 > Edit »."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error title=Interrogation D1 impossible (HTTP ${code})::${motifs:-sans motif}"
            exit 1
          fi
          trouve=$(jq -r '[.result[]? | select(.name=="canlii") | .uuid] | .[0] // ""' /tmp/d1.json)
          if [ -z "$trouve" ] || [ "$trouve" != "$attendu" ]; then
            echo "::error title=Discordance sur la base D1 « canlii »::Attendu=${attendu}, trouvé=${trouve:-absent}."
            exit 1
          fi
          echo "Base D1 « canlii » vérifiée (${attendu})."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Types du Worker
        run: npx wrangler types

      - name: Type-check
        run: npx tsc --noEmit

      - name: Mise en forme et lint
        run: npx biome check .

      - name: Tests
        run: npx vitest run

      - name: Audit des dépendances
        run: npm run audit

      - name: Paquet de déploiement (à blanc)
        run: npx wrangler deploy --dry-run

      - name: Migrations D1 et déploiement (npm run deploy)
        id: deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_COMPTE }}

      - name: Post-mortem — état des migrations D1 après échec
        if: failure() && steps.deploy.conclusion == 'failure'
        run: npx wrangler d1 migrations list canlii --remote || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_COMPTE }}

      - name: Vérification vivante (/health et /mcp/server-card)
        if: success()
        env:
          ATTENDU_LONG: ${{ github.sha }}
          SANTE: https://jurisprudence.poirierlavoie.ca/health
          CARTE: https://jurisprudence.poirierlavoie.ca/mcp/server-card
        run: |
          set -euo pipefail
          attendu="${ATTENDU_LONG:0:7}"
          ok=0
          for i in $(seq 1 8); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$SANTE" || echo 000)
            if [ "$code" = "200" ]; then
              enligne=$(jq -r '.commit // "absent"' /tmp/health.json)
              if [ "$enligne" = "$attendu" ]; then
                echo "Production alignée sur /health : commit ${enligne} (tentative ${i}/8)."
                ok=1
                break
              fi
              echo "Tentative ${i}/8 : /health HTTP 200 mais commit=${enligne} (attendu ${attendu})."
            else
              echo "Tentative ${i}/8 : /health HTTP ${code}."
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error title=Vérification /health échouée::Le commit ${attendu} n'est pas apparu sur ${SANTE}."
            exit 1
          fi
          code_carte=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$CARTE" || echo 000)
          if [ "$code_carte" != "200" ]; then
            echo "::error title=Fiche SEP-2127 indisponible (HTTP ${code_carte})::${CARTE} n'a pas rendu 200."
            exit 1
          fi
          echo "Fiche SEP-2127 (/mcp/server-card) : HTTP 200."
