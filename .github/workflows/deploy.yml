name: deploy

# ⚠ ORDRE IMPÉRATIF (spécification §12) : LES MIGRATIONS D'ABORD, LE DÉPLOIEMENT
#   ENSUITE. Le schéma inverse met en ligne du code qui lit des colonnes
#   inexistantes — et un connecteur juridique qui échoue en silence sur une
#   colonne manquante est exactement le défaut que ce dépôt cherche à rendre
#   impossible. Rien de ce qui suit n'assouplit cet ordre : pas de
#   `continue-on-error`, pas d'inversion, et l'étape « Déploiement » porte
#   désormais son `if: success()` EN TOUTES LETTRES plutôt qu'en sous-entendu.
#
# ⚠ POURQUOI CE FICHIER EST BAVARD — état relevé le 2026-09-16.
#   Dix-neuf exécutions depuis le 2026-07-23, dix-neuf échecs, TOUJOURS à
#   l'étape « Migrations D1 », et toujours en UNE À DEUX SECONDES. Aucune
#   version en production n'est jamais sortie d'ici ; tout a été déployé à la
#   main (voir CLAUDE.md, « Commandes »).
#
#   Le fait décisif n'est pas l'échec, c'est son OPACITÉ : les journaux de la CI
#   exigent des droits d'administration (l'API rend 403 « Must have admin rights
#   to Repository »), tandis que le NOM et la CONCLUSION de chaque étape sont,
#   eux, publics. Dix-neuf fois, le seul renseignement diffusé a donc été
#   « quelque chose a mal tourné du côté de D1 » — ce qui est faux : une à deux
#   secondes, c'est le temps qu'il faut à wrangler pour démarrer et renoncer
#   AVANT tout appel réseau. Mesuré le 2026-09-16 : 1,3 s sans justificatif,
#   1,8 s avec un jeton refusé. L'audit d'egress de `harden-runner`, lui PUBLIC,
#   le confirme : `api.cloudflare.com` n'apparaît dans AUCUNE des exécutions
#   examinées. Le jeton n'a donc jamais été présenté à Cloudflare.
#
#   D'où les quatre contrôles ci-dessous. Ils ne réparent rien et n'ont aucun
#   pouvoir de le faire : ils déplacent le diagnostic du corps du journal, que
#   personne ne peut lire, vers le NOM DE L'ÉTAPE, que tout le monde voit. Le
#   mode de panne combattu ici n'est pas la panne, c'est le rouge muet — celui
#   auquel on finit par ne plus croire, y compris le jour où il change de cause.
#
#   Contrôles en LECTURE SEULE, sur api.cloudflare.com, avant que quoi que ce
#   soit ne touche la production. Ils ne divulguent jamais une valeur : ni le
#   jeton, ni sa longueur, ni l'identifiant de compte (masqué par
#   `::add-mask::`) — seulement des verdicts. Le dépôt est PUBLIC et ses
#   journaux le sont autant.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois : deux exécutions concurrentes pourraient appliquer
# des migrations dans le désordre.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          # `audit` observe et ne bloque pas : les contrôles ci-dessous joignent
          # api.cloudflare.com sans autorisation particulière. ⚠ Le jour où cette
          # politique passerait à `block`, il faudrait déclarer
          # `api.cloudflare.com:443` dans `allowed-endpoints` — faute de quoi les
          # contrôles échoueraient en accusant le jeton d'un tort qui serait ici.
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ── LES QUATRE CONTRÔLES ──────────────────────────────────────────────
      # Placés AVANT `npm ci` et les tests, et non après : un défaut de
      # justificatif se constate en deux secondes, et le constater au bout de
      # quarante-cinq ne change ni le verdict ni le correctif. Les tests restent
      # intégralement en amont des migrations, ce qui est la seule chose que
      # l'ordre des étapes doit garantir ; `ci.yml` les rejoue de toute façon sur
      # le même commit.
      #
      # Aucune expression « ${{ }} » n'apparaît dans un `run:` : tout entre par
      # `env:`. Une expression est substituée dans le TEXTE du script avant que
      # le shell ne le lise — elle ne se cite pas. L'habitude vaut pour une
      # entrée hostile comme pour un secret mal formé.

      - name: Contrôle 1/4 — le secret CLOUDFLARE_API_TOKEN parvient-il au job ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            # Forme seulement, et par filtrage de motif : aucune copie, aucune
            # transformation, rien qui puisse atterrir dans le journal. GitHub
            # masque la valeur EXACTE d'un secret ; il ne masque ni une valeur
            # rognée, ni une découpe, ni un décompte. On ne produit donc que des
            # « oui / non ».
            case "$CLOUDFLARE_API_TOKEN" in
              *[[:space:]]*)
                echo "::error title=Le jeton contient une espace ou un saut de ligne::Un jeton copié avec son retour chariot est refusé par Cloudflare sans que rien ne l'explique — le piège déjà consigné en §14. Recoller la valeur SANS la dernière frappe d'entrée."
                exit 1
                ;;
            esac
            echo "Le secret est présent et ne porte aucune espace. Rien d'autre n'en est dit."
            exit 0
          fi
          echo "::error title=CLOUDFLARE_API_TOKEN est VIDE dans ce job::Le secret n'existe pas sous ce nom, ou n'est pas visible d'ici. C'est la cause la plus probable des dix-neuf échecs d'une à deux secondes."
          echo "Ce que wrangler aurait dit à l'étape des migrations, mot pour mot :"
          echo "  « In a non-interactive environment, it's necessary to set a"
          echo "    CLOUDFLARE_API_TOKEN environment variable for wrangler to work. »"
          echo "…et l'échec aurait eu l'air d'un problème de D1. Il n'en est pas un :"
          echo "wrangler renonce AVANT d'appeler quoi que ce soit."
          echo
          echo "Où regarder, dans l'ordre :"
          echo "  1. Settings > Secrets and variables > Actions > onglet « Secrets »."
          echo "     Le nom est sensible à la casse et ne tolère pas d'espace."
          echo "  2. Settings > Environments > production > « Environment secrets »."
          echo "     Ce job déclare « environment: production » : un secret déposé"
          echo "     dans un AUTRE environnement n'est pas visible ici."
          echo "  3. Les onglets « Dependabot » et « Codespaces » de la même page"
          echo "     portent des secrets HOMONYMES qu'Actions ne lit jamais."
          echo "  4. Tableau de bord Cloudflare > My Profile > API Tokens : si la"
          echo "     colonne « Last used » du jeton de la CI est restée vide depuis"
          echo "     le 2026-07-23, aucune requête n'est jamais partie d'ici — et"
          echo "     c'est la confirmation extérieure de ce diagnostic."
          exit 1

      - name: Contrôle 2/4 — Cloudflare accepte-t-il ce jeton ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "::error::jq est absent de l'image du runner."; exit 1; }
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/verify.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/user/tokens/verify || echo 000)
          statut=$(jq -r '.result.status // "inconnu"' /tmp/verify.json 2>/dev/null || echo inconnu)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/verify.json 2>/dev/null || echo "")
          case "$code" in
            200)
              echo "Jeton reconnu, statut « ${statut} »."
              if [ "$statut" != "active" ]; then
                echo "::error title=Jeton non actif (${statut})::Un jeton expiré ou suspendu se remplace ; il ne se répare pas."
                exit 1
              fi
              ;;
            401|403)
              echo "::error title=Jeton REFUSÉ par Cloudflare (HTTP ${code})::${motifs:-aucun motif rendu}. Le secret arrive bien jusqu'ici : c'est sa VALEUR qui est en cause — révoquée, expirée, tronquée à la copie, ou restreinte par une liste d'adresses IP qui exclut les exécuteurs GitHub."
              exit 1
              ;;
            000)
              echo "::error title=api.cloudflare.com injoignable::Ni le jeton ni D1 ne sont en cause. Vérifier la politique de sortie du durcisseur déclaré plus haut."
              exit 1
              ;;
            *)
              # Un jeton détenu par le COMPTE (et non par l'utilisateur) ne se
              # vérifie pas sur /user/tokens/verify. Ce n'est donc pas une panne,
              # et le dire serait une fausse accusation : les contrôles 3 et 4
              # tranchent, eux, sur ce dont wrangler a réellement besoin.
              echo "::notice title=Vérification non concluante (HTTP ${code})::${motifs:-sans motif}. Non bloquant : la suite éprouve directement l'accès au compte puis à D1."
              ;;
          esac

      - name: Contrôle 3/4 — le jeton désigne-t-il UN SEUL compte ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Facultatif, et délibérément facultatif : le correctif doit être utile
          # SANS qu'un réglage nouveau soit créé — personne ne peut en créer
          # depuis le dépôt. Vide, on reproduit exactement ce que fait wrangler :
          # découvrir le compte tout seul.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
            echo "CF_COMPTE=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
            echo "Compte fourni par la configuration : wrangler ne fera aucune découverte."
            exit 0
          fi
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/comptes.json -w '%{http_code}' \
                   https://api.cloudflare.com/client/v4/accounts || echo 000)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/comptes.json 2>/dev/null || echo "")
          if [ "$code" != "200" ]; then
            echo "::error title=Le jeton ne peut pas énumérer les comptes (HTTP ${code})::${motifs:-sans motif}. wrangler dirait « Failed to automatically retrieve account IDs… You may have incorrect permissions on your API token ». Deux issues : ajouter « User > Memberships > Read » au jeton, OU lui épargner la découverte en posant CLOUDFLARE_ACCOUNT_ID (voir l'en-tête de ce fichier)."
            exit 1
          fi
          n=$(jq '[.result[]?] | length' /tmp/comptes.json)
          echo "Comptes visibles par ce jeton : ${n}."
          if [ "$n" -eq 0 ]; then
            echo "::error title=Ce jeton ne voit AUCUN compte::Sa portée (« Account Resources ») ne comprend pas le compte de production. Il ne servira à rien tant qu'elle n'est pas corrigée."
            exit 1
          fi
          if [ "$n" -gt 1 ]; then
            echo "::error title=Ce jeton voit ${n} comptes et rien ne les départage::wrangler dirait « More than one account available but unable to select one in non-interactive mode ». Poser CLOUDFLARE_ACCOUNT_ID — variable de dépôt — pour nommer le bon."
            exit 1
          fi
          compte=$(jq -r '.result[0].id' /tmp/comptes.json)
          echo "::add-mask::$compte"
          echo "CF_COMPTE=$compte" >> "$GITHUB_ENV"
          echo "Un seul compte : wrangler le choisira sans ambiguïté."

      - name: Contrôle 4/4 — la base « canlii » vue d'ici est-elle celle de wrangler.jsonc ?
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # L'identifiant attendu est lu dans le fichier versionné, où il est
          # PUBLIC depuis toujours : le comparer ne divulgue rien. C'est le seul
          # contrôle qui sépare « le jeton n'a pas les droits » de « le jeton
          # vise un autre compte » — deux causes qui, sans lui, rendent le même
          # rouge.
          if [ -z "${CF_COMPTE:-}" ]; then
            echo "::error title=Le contrôle 3 n'a pas transmis d'identifiant de compte::Anomalie du workflow lui-même et non des justificatifs."
            exit 1
          fi
          attendu=$(grep -oE '"database_id"[[:space:]]*:[[:space:]]*"[^"]+"' wrangler.jsonc | head -1 | grep -oE '[0-9a-fA-F-]{36}' || true)
          if [ -z "$attendu" ]; then
            echo "::error title=Identifiant de base D1 illisible dans wrangler.jsonc::Le contrôle ne peut pas comparer ce qu'il ne sait pas lire ; il s'abstient plutôt que de conclure."
            exit 1
          fi
          code=$(curl -sS --max-time 20 \
                   -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                   -o /tmp/d1.json -w '%{http_code}' \
                   "https://api.cloudflare.com/client/v4/accounts/${CF_COMPTE}/d1/database?name=canlii" || echo 000)
          motifs=$(jq -r '[.errors[]? | "\(.code): \(.message)"] | join(" | ")' /tmp/d1.json 2>/dev/null || echo "")
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error title=Le jeton n'a pas D1 sur ce compte (HTTP ${code})::${motifs:-sans motif}. Ajouter « Account > D1 > Edit » au jeton. C'est la cause qui expliquerait un échec cantonné aux migrations, alors que « wrangler deploy » aurait, lui, abouti."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error title=Interrogation de D1 impossible (HTTP ${code})::${motifs:-sans motif}"
            exit 1
          fi
          trouve=$(jq -r '[.result[]? | select(.name=="canlii") | .uuid] | .[0] // ""' /tmp/d1.json)
          if [ -z "$trouve" ]; then
            echo "::error title=Aucune base « canlii » sur le compte que voit ce jeton::Le jeton est valide, mais il regarde ailleurs que la production. Défaut de PORTÉE, pas de droits."
            exit 1
          fi
          if [ "$trouve" != "$attendu" ]; then
            echo "::error title=Une base « canlii » existe mais ce n'est pas celle de wrangler.jsonc::Migrer celle-là appliquerait le schéma à une base étrangère, sans la moindre erreur pour le signaler. Exactement le genre de succès faux que ce dépôt refuse."
            exit 1
          fi
          echo "Base « canlii » visible, et son identifiant est bien celui de wrangler.jsonc."
          echo "::notice title=Ce feu vert a une borne — énoncée plutôt que sous-entendue::Il prouve la LECTURE de D1, jamais l'ÉCRITURE. Un jeton porteur de « D1 > Read » sans « D1 > Edit » franchirait ces quatre contrôles et échouerait quand même à l'étape des migrations — si cela arrive, c'est là qu'il faut regarder, et nulle part ailleurs."

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Filet : on ne déploie pas un arbre qui ne compile pas ou dont les tests
      # échouent, même si la CI a déjà tourné sur la PR.
      - name: Types du Worker
        run: npx wrangler types
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run

      - name: Migrations D1 (AVANT le déploiement)
        id: migrations
        run: npx wrangler d1 migrations apply canlii --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Posé ici ET au déploiement : renseigné, il fait sauter à wrangler la
          # découverte du compte — un appel de moins, une cause d'échec de moins.
          # Vide, il est ignoré : wrangler traite la chaîne vide comme une
          # absence, ce qui est précisément ce qui permet à ce fichier de servir
          # avant que le réglage n'existe.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Déploiement
        # Sous-entendu jusqu'ici, écrit désormais : l'invariant de §12 tient à ce
        # que cette étape ne parte JAMAIS après une migration échouée. La valeur
        # par défaut disait déjà cela ; une valeur par défaut ne se relit pas.
        if: success()
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Après l'échec, jamais avant, et seulement s'il vient des migrations : dire
      # OÙ le train s'est arrêté. `migrations list` n'applique rien. Ne change pas
      # la conclusion du job — l'échec reste un échec, le déploiement reste sauté.
      - name: Post-mortem — quelles migrations restaient en attente ?
        if: failure() && steps.migrations.conclusion == 'failure'
        run: npx wrangler d1 migrations list canlii --remote || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
